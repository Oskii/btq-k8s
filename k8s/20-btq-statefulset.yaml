apiVersion: v1
kind: ConfigMap
metadata:
  name: btq-cluster-config
  namespace: btqnet
data:
  BTQ_NODES: "__BTQ_NODES__"
  BTQ_NETWORK: "__BTQ_NETWORK__"
  BTQ_HEADLESS: "btq-headless"
  BTQ_NAMESPACE: "btqnet"
---
apiVersion: v1
kind: Secret
metadata:
  name: btq-rpc-credentials
  namespace: btqnet
type: Opaque
stringData:
  BTQ_RPC_USER: "btq"
  BTQ_RPC_PASSWORD: "btq"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: btq-node
  namespace: btqnet
  labels:
    app.kubernetes.io/name: btq-node
spec:
  serviceName: btq-headless
  replicas: __BTQ_NODES__
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: btq-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btq-node
        app.kubernetes.io/part-of: btqnet
      annotations:
        prometheus.io/scrape: "false"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: btqd
          image: btq-node:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: btq-cluster-config
            - secretRef:
                name: btq-rpc-credentials
          ports:
            - name: rpc
              containerPort: __RPC_PORT__
            - name: p2p
              containerPort: __P2P_PORT__
            - name: zmq
              containerPort: 28332
            - name: zmq-seq
              containerPort: 28333
          readinessProbe:
            tcpSocket:
              port: __RPC_PORT__
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: __P2P_PORT__
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "__BTQ_MEMORY__"
          volumeMounts:
            - name: data
              mountPath: /var/lib/btq/data
  # PersistentVolumeClaim per pod so IBD progress (and wallets) survive
  # pod restarts and rolling updates.  kind ships a default storage
  # class (`standard`) backed by local-path-provisioner so this works
  # out of the box.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: __BTQ_STORAGE__
