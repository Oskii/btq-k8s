apiVersion: v1
kind: Service
metadata:
  name: btq-controller
  namespace: btqnet
  labels:
    app.kubernetes.io/name: btq-controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: btq-controller
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
    - name: ui
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: btq-controller-nodeport
  namespace: btqnet
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: btq-controller
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      nodePort: 30100
    - name: ui
      port: 9200
      targetPort: 9200
      nodePort: 30200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btq-controller
  namespace: btqnet
  labels:
    app.kubernetes.io/name: btq-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: btq-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btq-controller
    spec:
      enableServiceLinks: false
      containers:
        - name: controller
          image: btq-controller:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: btq-cluster-config
            - secretRef:
                name: btq-rpc-credentials
          # Pacing knobs (only effective on regtest, where mining/tx
          # generation is enabled by default).  ENABLE_MINING /
          # ENABLE_TX / ENABLE_BOOTSTRAP are intentionally NOT set here
          # so the controller picks per-network defaults: regtest = on,
          # everything else = off.  Override at runtime with e.g.
          #   kubectl set env deploy/btq-controller ENABLE_MINING=1
          env:
            - name: SCRAPE_INTERVAL
              value: "3"
            - name: BLOCK_INTERVAL
              value: "10"
            - name: TX_INTERVAL
              value: "4"
          ports:
            - name: metrics
              containerPort: 9100
            - name: ui
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
