apiVersion: v1
kind: Service
metadata:
  name: btq-controller
  namespace: btqnet
  labels:
    app.kubernetes.io/name: btq-controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: btq-controller
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: btq-controller-nodeport
  namespace: btqnet
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: btq-controller
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
      nodePort: 30100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btq-controller
  namespace: btqnet
  labels:
    app.kubernetes.io/name: btq-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: btq-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btq-controller
    spec:
      enableServiceLinks: false
      containers:
        - name: controller
          image: btq-controller:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: btq-cluster-config
            - secretRef:
                name: btq-rpc-credentials
          env:
            - name: SCRAPE_INTERVAL
              value: "3"
            - name: BLOCK_INTERVAL
              value: "10"
            - name: TX_INTERVAL
              value: "4"
            - name: ENABLE_MINING
              value: "1"
            - name: ENABLE_TX
              value: "1"
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
