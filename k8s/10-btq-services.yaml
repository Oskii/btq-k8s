# Headless Service powers stable per-pod DNS:
#   btq-node-N.btq-headless.btqnet.svc.cluster.local
# This is what the entrypoint uses for -addnode and what the controller
# uses for RPC scraping.
#
# Port numbers are templated by bin/btqnet because they differ per chain
# (regtest 18443/18444, test 18332/18333, signet 38332/38333, main 8332/8333).
apiVersion: v1
kind: Service
metadata:
  name: btq-headless
  namespace: btqnet
  labels:
    app.kubernetes.io/name: btq-node
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: btq-node
  ports:
    - name: p2p
      port: __P2P_PORT__
      targetPort: __P2P_PORT__
    - name: rpc
      port: __RPC_PORT__
      targetPort: __RPC_PORT__
    - name: zmq
      port: 28332
      targetPort: 28332
    - name: zmq-seq
      port: 28333
      targetPort: 28333
---
# Round-robin RPC service; useful when you don't care which node answers.
apiVersion: v1
kind: Service
metadata:
  name: btq-rpc
  namespace: btqnet
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: btq-node
  ports:
    - name: rpc
      port: __RPC_PORT__
      targetPort: __RPC_PORT__
